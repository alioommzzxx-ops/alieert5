<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070816">
<title>WEB EXTRACTOR PRO</title>
<style>
:root{--bg:#070816;--p:#7c3aed;--b:#38bdf8;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--tx:#e8eaf6;--mut:#9aa3c7;
--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--r:18px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;min-height:100vh;line-height:1.6;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 85% 0%,rgba(124,58,237,.35),transparent),radial-gradient(50% 45% at 0% 30%,rgba(56,189,248,.22),transparent),radial-gradient(60% 50% at 50% 100%,rgba(99,102,241,.22),transparent)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:280px;height:280px;background:var(--p);top:10%;left:-60px}
.bg i:nth-child(2){width:240px;height:240px;background:var(--b);bottom:8%;right:-50px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.wrap{max-width:1120px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 0 24px rgba(124,58,237,.55)}
.brand span b{background:linear-gradient(90deg,#c4b5fd,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-r{display:flex;align-items:center;gap:8px}
.dev-pill{font-size:.78rem;padding:6px 12px;min-height:36px;border-radius:99px;color:#e9d5ff;border-color:rgba(167,139,250,.45);background:rgba(124,58,237,.18)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card{padding:18px;margin-top:16px}
.hero{text-align:center;padding:14px 4px 4px}
.hero h1{font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.25;background:linear-gradient(90deg,#fff,#c4b5fd 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:10px auto 0;max-width:640px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--tx);background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:.2s;min-height:44px}
button:hover,.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
button:disabled,.btn.off{opacity:.45;pointer-events:none}
.primary{background:linear-gradient(135deg,var(--p),#4f46e5 60%,var(--b));border-color:transparent;font-weight:700;box-shadow:0 6px 24px rgba(99,102,241,.45)}
.danger{border-color:rgba(251,113,133,.5);color:#fecdd3}
.row{display:flex;gap:10px;flex-wrap:wrap}
.urlrow{display:flex;gap:10px;flex-wrap:wrap}
.urlrow input{flex:1 1 260px;min-width:0;font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px 14px;direction:ltr;text-align:left;outline:none;min-height:48px}
.urlrow input:focus,.search:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.err{color:#fecdd3;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);border-radius:12px;padding:10px 12px;margin-top:12px}
details{color:var(--mut)}
summary{cursor:pointer;padding:6px 0}
.opts-d{margin-top:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.opts input[type=number]{font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opts .ck{flex-direction:row;align-items:center;gap:8px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--b));border-radius:99px;transition:width .35s;box-shadow:0 0 14px rgba(56,189,248,.6)}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.stat{padding:12px;text-align:center;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem;direction:ltr}
.stat span{color:var(--mut);font-size:.82rem}

/* ===== بطاقات المعلومات ===== */
.sec-t{display:flex;align-items:center;gap:10px;margin:26px 2px 4px;font-size:1.15rem}
.sec-t small{color:var(--mut);font-weight:400;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:12px}
.ic{position:relative;padding:18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;animation:pop .45s ease both}
.ic::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,var(--c1,var(--p)),var(--c2,var(--b)))}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.ic.wide{grid-column:1/-1}
.ic h3{display:flex;align-items:center;gap:10px;font-size:1.02rem;margin-bottom:12px}
.ic h3 .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1,var(--p)),var(--c2,var(--b)));color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:minmax(90px,36%) 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--mut)}
.kv dd{margin:0;word-break:break-word;direction:ltr;text-align:start}
.kv dd.rtl{direction:inherit}
.mono{font-family:var(--mono);font-size:.82rem}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:rgba(56,189,248,.14);color:#bae6fd;border:1px solid rgba(56,189,248,.3);direction:ltr}
.bd.ok{background:rgba(52,211,153,.14);color:var(--ok);border-color:rgba(52,211,153,.35)}
.bd.bad{background:rgba(251,113,133,.14);color:var(--bad);border-color:rgba(251,113,133,.35)}
.bd.warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.35)}
.bd.pur{background:rgba(124,58,237,.22);color:#ddd6fe;border-color:rgba(167,139,250,.4)}
.big{font-size:1.5rem;font-weight:800;direction:ltr;text-align:start;word-break:break-all}
.sub{color:var(--mut);font-size:.84rem}
.note{color:var(--mut);font-size:.82rem;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.empty{color:var(--mut);padding:8px 0}
.dbrow{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.dbrow b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbrow code{direction:ltr;text-align:start;font-family:var(--mono);font-size:.8rem;color:#bae6fd;word-break:break-all}
.techgrp{margin-bottom:10px}
.techgrp>span{display:block;font-size:.76rem;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.sec-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{--v:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--rc,var(--ok)) calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:72px;height:72px;border-radius:50%;background:#0d0f26;display:grid;place-items:center;font-size:1.3rem;direction:ltr}
.shl{flex:1 1 180px;display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.shl div{display:flex;justify-content:space-between;gap:8px;direction:ltr}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;direction:ltr;text-align:left}
.tbl td,.tbl th{padding:5px 8px;border-bottom:1px dashed var(--line);text-align:start;word-break:break-all}
.tbl th{color:var(--mut);font-weight:600}
.scroll{max-height:260px;overflow:auto}
pre.raw{direction:ltr;text-align:left;font-family:var(--mono);font-size:.76rem;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#cbd5ff;margin-top:8px}
.chain{direction:ltr;text-align:left;font-size:.8rem;color:var(--mut);margin-top:6px}

/* ===== الملفات ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.chip{padding:6px 12px;min-height:36px;font-size:.85rem;border-radius:99px}
.chip.on{background:linear-gradient(135deg,var(--p),var(--b));border-color:transparent}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.search{flex:1 1 220px;font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-height:44px}
.files{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.fc{--c1:var(--p);--c2:var(--b);padding:14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:.2s}
.fc:hover{border-color:rgba(167,139,250,.5);transform:translateY(-2px)}
.fc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--c1),var(--c2))}
.fc-top{display:flex;gap:12px;align-items:center}
.fi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fi svg{width:22px;height:22px}
.fn{min-width:0;flex:1}
.fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-weight:650}
.fn small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-size:.76rem}
.fm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.7rem;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(124,58,237,.3);border:1px solid rgba(124,58,237,.5);direction:ltr}
.sz{color:var(--mut);font-size:.85rem;direction:ltr;white-space:nowrap}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.done{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.failed{background:rgba(251,113,133,.15);color:var(--bad)}
.pill.skipped{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.pending,.pill.downloading{background:rgba(56,189,248,.15);color:var(--b)}
.fa{display:flex;gap:8px}
.fa .btn,.fa button{flex:1;min-height:40px;padding:6px 10px;font-size:.88rem}
.fa .btn.dl{background:linear-gradient(135deg,var(--p),#4f46e5 60%,var(--b));border-color:transparent;font-weight:700}
.fa button.sm{flex:0 0 auto}
.fe{color:#fecdd3;font-size:.82rem}
.fd{border-top:1px dashed var(--line);padding-top:10px}
.fd .kv{font-size:.82rem}
.steps{padding-inline-start:22px;color:var(--mut);font-size:.9rem;margin-top:8px}.steps li{margin:5px 0}.steps code{direction:ltr;unicode-bidi:embed;font-family:var(--mono);font-size:.82rem;color:#bae6fd}
.notice h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.notice ul{padding-inline-start:20px;color:var(--mut);font-size:.9rem}
.hist{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:.88rem}
.hist div{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;direction:ltr;padding:6px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12142e;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:9;max-width:92vw}
[hidden]{display:none!important}
footer{margin-top:28px;text-align:center}
.dev{display:inline-flex;flex-direction:column;gap:4px;align-items:center;padding:16px 26px;border-radius:20px;background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(56,189,248,.14));border:1px solid rgba(167,139,250,.4);box-shadow:0 10px 36px rgba(124,58,237,.25)}
.dev b{font-size:1.1rem;background:linear-gradient(90deg,#fff,#c4b5fd,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.dev span{color:var(--mut);font-size:.82rem}
.use{color:var(--mut);font-size:.8rem;margin-bottom:14px}
@media(max-width:640px){.grid,.files{grid-template-columns:1fr}.dev-pill{display:none}.kv{grid-template-columns:minmax(80px,38%) 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-cookie" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 4 4 0 0 0 5 5 3 3 0 0 0 4 4z"/><path d="M8.5 10h.01M12 15h.01M15.5 16.5h.01M8 15h.01"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>

<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-8 9"/></symbol>
<symbol id="i-font" viewBox="0 0 24 24"><path d="M5 20L12 4l7 16M8 14h8"/></symbol>
<symbol id="i-json" viewBox="0 0 24 24"><path d="M9 4C6 4 7 8 5 9c2 1 1 5 4 5M15 4c3 0 2 4 4 5-2 1-1 5-4 5M9 20h.01M15 20h.01"/></symbol>
<symbol id="i-play2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-braces" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/></symbol>
</defs></svg>
<div class="bg"><i></i><i></i></div>
<div class="wrap">
<header>
  <div class="brand"><div class="logo"><svg class="i"><use href="#i-shield"/></svg></div><span>WEB EXTRACTOR <b>PRO</b></span></div>
  <div class="hdr-r"><span class="dev-pill btn" id="devPill" style="cursor:default"></span><button id="langBtn" type="button" aria-label="Language">EN</button></div>
</header>

<section class="hero"><h1 data-t="headline"></h1><p data-t="sub"></p></section>

<section id="setup" class="card glass">
  <details id="setupD"><summary data-t="setupT" style="font-weight:700;color:var(--tx)"></summary>
    <ol id="wSteps" class="steps"></ol>
    <div class="row" style="margin-top:10px"><button id="wCopy" type="button" class="primary"><svg class="i"><use href="#i-copy"/></svg><span data-t="wCopy"></span></button></div>
    <div class="urlrow" style="margin-top:12px"><input id="wUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://xxxx.workers.dev"><button id="wSave" type="button"><span data-t="wSave"></span></button><span id="wStat" class="sub"></span></div>
  </details>
</section>

<section class="card glass">
  <div class="urlrow">
    <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://example.com">
    <button id="startBtn" class="primary" type="button"><svg class="i"><use href="#i-play"/></svg><span data-t="start"></span></button>
    <button id="stopBtn" class="danger" type="button" disabled><svg class="i"><use href="#i-stop"/></svg><span data-t="stop"></span></button>
  </div>
  <div id="err" class="err" hidden></div>
  <details class="opts-d">
    <summary data-t="options"></summary>
    <div class="opts">
      <label><span data-t="maxPages"></span><input id="oPages" type="number" min="1" max="50" value="10"></label>
      <label><span data-t="maxDepth"></span><input id="oDepth" type="number" min="0" max="3" value="1"></label>
      <label><span data-t="maxFiles"></span><input id="oFiles" type="number" min="1" max="500" value="200"></label>
      <label><span data-t="maxMb"></span><input id="oMb" type="number" min="1" max="25" value="10"></label>
      <label class="ck"><input id="oRobots" type="checkbox" checked><span data-t="robots"></span></label>
    </div>
  </details>
</section>

<section id="run" class="card glass" hidden>
  <div class="status"><span id="phase"></span><b id="pct" dir="ltr">0%</b></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="stats">
    <div class="stat"><b id="sD">0</b><span data-t="sDisc"></span></div>
    <div class="stat"><b id="sO" style="color:var(--ok)">0</b><span data-t="sDown"></span></div>
    <div class="stat"><b id="sF" style="color:var(--bad)">0</b><span data-t="sFail"></span></div>
    <div class="stat"><b id="sS">0 B</b><span data-t="sSize"></span></div>
  </div>
</section>

<!-- بطاقات معلومات الموقع -->
<section id="infoSec" hidden>
  <h2 class="sec-t"><svg class="i"><use href="#i-info"/></svg><span data-t="infoT"></span><small data-t="infoSub"></small></h2>

<script type="text/plain" id="workerSrc">
// WEB EXTRACTOR PRO — Cloudflare Worker (وسيط CORS آمن)
// الصق هذا الكود كاملاً في Cloudflare ← Workers & Pages ← Create ← Hello World ← Edit code ← Deploy.
// اختياري: ضع رابط موقعك على GitHub Pages هنا ليستخدم الوسيط موقعك فقط (مثال: "https://username.github.io")
const ALLOWED_ORIGIN = "";

const MAX_BYTES = 25 * 1024 * 1024;
const MAX_REDIRECTS = 5;
const PORTS = new Set(["", "80", "443", "8080", "8443"]);
const UA = "WebExtractorPro/2.0 (public-resources collector)";
const BLOCKED_HOST = /^(localhost|metadata|instance-data|.*\.(local|localhost|internal|intranet|lan|home|corp|workers\.dev))$/i;

function cors(origin) {
  return {
    "Access-Control-Allow-Origin": ALLOWED_ORIGIN || origin || "*",
    "Access-Control-Expose-Headers": "x-proxy-meta, x-proxy-error, x-proxy-detail",
    "Access-Control-Allow-Methods": "GET, OPTIONS",
    "Vary": "Origin",
  };
}

function fail(origin, status, code, detail = "") {
  return new Response(null, {
    status,
    headers: { ...cors(origin), "x-proxy-error": code, "x-proxy-detail": String(detail).slice(0, 100) },
  });
}

function badHost(h) {
  h = h.toLowerCase().replace(/^\[|\]$/g, "").replace(/\.$/, "");
  if (BLOCKED_HOST.test(h)) return true;
  if (h.includes(":")) return true; // IPv6 literals غير مسموحة
  if (/^[\d.]+$/.test(h) || /^0x[0-9a-f]+$/i.test(h)) return true; // IP literals بكل صيغها
  return !h.includes(".");
}

function validate(raw) {
  let u;
  try { u = new URL(raw); } catch { return null; }
  if (u.protocol !== "http:" && u.protocol !== "https:") return null;
  if (u.username || u.password) return null;
  if (!PORTS.has(u.port)) return null;
  if (badHost(u.hostname)) return null;
  return u;
}

function cookieInfo(resp) {
  // أسماء الكوكيز وأعلامها فقط — لا تُرسَل القيم أبداً
  let list = [];
  try { list = resp.headers.getSetCookie ? resp.headers.getSetCookie() : []; } catch { /* ignore */ }
  return list.slice(0, 30).map((c) => {
    const parts = c.split(";").map((p) => p.trim());
    const low = parts.slice(1).map((p) => p.toLowerCase());
    const ss = low.find((p) => p.startsWith("samesite="));
    return {
      name: parts[0].split("=")[0].slice(0, 60),
      secure: low.includes("secure"),
      httponly: low.includes("httponly"),
      samesite: ss ? ss.split("=")[1] : "—",
    };
  });
}

function limiter(max) {
  let n = 0;
  return new TransformStream({
    transform(chunk, ctl) {
      n += chunk.byteLength;
      if (n > max) ctl.error(new Error("too_large"));
      else ctl.enqueue(chunk);
    },
  });
}

export default {
  async fetch(req, env) {
    const origin = req.headers.get("Origin") || "";
    const allowed = (env && env.ALLOWED_ORIGIN) || ALLOWED_ORIGIN;
    if (req.method === "OPTIONS") return new Response(null, { status: 204, headers: cors(origin) });
    if (allowed && origin !== allowed) return fail(origin, 403, "forbidden");

    const q = new URL(req.url).searchParams;
    const target = q.get("url");
    if (!target) return new Response("WEB EXTRACTOR PRO worker is running ✔", { headers: cors(origin) });
    let cur = validate(target);
    if (!cur) return fail(origin, 400, "unsafe");
    const max = Math.min(parseInt(q.get("max") || "", 10) || MAX_BYTES, MAX_BYTES);
    const accept = q.get("a") === "h" ? "text/html,application/xhtml+xml,*/*;q=0.8" : "*/*";

    const t0 = Date.now();
    const chain = [];
    let resp = null;
    try {
      for (let i = 0; i <= MAX_REDIRECTS; i++) {
        resp = await fetch(cur.toString(), {
          redirect: "manual",
          headers: { "User-Agent": UA, Accept: accept },
          cf: { cacheTtl: 0 },
        });
        if ([301, 302, 303, 307, 308].includes(resp.status)) {
          const loc = resp.headers.get("location");
          if (!loc) return fail(origin, 502, "redirect_bad");
          chain.push({ url: cur.toString(), status: resp.status });
          const next = validate(new URL(loc, cur).toString());
          if (!next) return fail(origin, 400, "unsafe");
          cur = next;
          resp = null;
          continue;
        }
        break;
      }
    } catch (e) {
      return fail(origin, 502, "network", e && e.message);
    }
    if (!resp) return fail(origin, 502, "too_many_redirects");

    const headers = {};
    let size = 0;
    for (const [k, v] of resp.headers) {
      if (/^(set-cookie|cookie|authorization)$/i.test(k)) continue;
      const val = v.slice(0, 200);
      size += k.length + val.length;
      if (size < 5000) headers[k.toLowerCase()] = val;
    }
    const meta = {
      final_url: cur.toString(), status: resp.status, headers, chain,
      cookies: cookieInfo(resp), ms: Date.now() - t0,
    };
    const out = { ...cors(origin), "x-proxy-meta": encodeURIComponent(JSON.stringify(meta)),
      "Content-Type": "application/octet-stream", "Cache-Control": "no-store", "X-Content-Type-Options": "nosniff" };

    const cl = parseInt(resp.headers.get("content-length") || "", 10);
    if (resp.status >= 400 || !resp.body) return new Response(null, { status: 200, headers: out });
    if (cl > max) return fail(origin, 413, "too_large");
    return new Response(resp.body.pipeThrough(limiter(max)), { status: 200, headers: out });
  },
};
</script>

/* ================= المحرك: يعمل كله داخل المتصفح عبر Cloudflare Worker ================= */
const WKEY="wep_worker";
const getW=()=>{let v="";try{v=localStorage.getItem(WKEY)||""}catch{}return(v||WORKER_URL||"").trim().replace(/\/+$/,"")};
class FErr extends Error{constructor(c,d=""){super(c);this.code=c;this.detail=d}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MAX_TOTAL=120*1024*1024;
let ctl=null, store=new Map(), runId=0;

/* ---------- الاتصال عبر الـ Worker ---------- */
async function pget(url,{html=false,max=10485760}={}){
  const W=getW();
  let r;
  try{r=await fetch(`${W}/?url=${encodeURIComponent(url)}&max=${max}${html?"&a=h":""}`,{signal:ctl.signal})}
  catch(e){if(e.name==="AbortError")throw e;throw new FErr("network","worker")}
  const err=r.headers.get("x-proxy-error");
  if(err)throw new FErr(err,r.headers.get("x-proxy-detail")||"");
  if(!r.ok)throw new FErr("worker","HTTP "+r.status);
  let meta={};try{meta=JSON.parse(decodeURIComponent(r.headers.get("x-proxy-meta")||"%7B%7D"))}catch{}
  if(!meta.status)throw new FErr("worker","bad response");
  if(meta.status>=400)throw new FErr("http_error","HTTP "+meta.status);
  let buf;try{buf=await r.arrayBuffer()}catch(e){if(e.name==="AbortError")throw e;throw new FErr("too_large")}
  if(buf.byteLength>max)throw new FErr("too_large");
  const h=meta.headers||{};
  return{url:meta.final_url||url,status:meta.status,headers:h,cookies:meta.cookies||[],chain:meta.chain||[],ms:meta.ms||0,buf,ct:h["content-type"]||""};
}

/* ---------- المحلل (HTML / CSS) ---------- */
const EXT={html:[".html",".htm",".xhtml",".php",".asp",".aspx",".jsp"],js:[".js",".mjs",".cjs"],css:[".css"],image:[".png",".jpg",".jpeg",".svg",".webp",".gif",".ico",".avif",".bmp"],font:[".woff",".woff2",".ttf",".otf",".eot"],json:[".json",".webmanifest"],media:[".mp3",".mp4",".webm",".ogg",".wav",".m4a",".mov",".m4v"],other:[".pdf",".txt",".xml",".csv"]};
const extOf=u=>{try{const p=new URL(u).pathname,i=p.lastIndexOf(".");return i>p.lastIndexOf("/")?p.slice(i).toLowerCase():""}catch{return""}};
function catFor(u,ct=""){const e=extOf(u);for(const c in EXT)if(EXT[c].includes(e))return c;ct=(ct||"").split(";")[0].trim().toLowerCase();if(!ct)return null;
  if(ct.includes("html"))return"html";if(/javascript|ecmascript/.test(ct))return"js";if(ct==="text/css")return"css";if(ct.startsWith("image/"))return"image";
  if(ct.startsWith("font/")||ct.includes("font"))return"font";if(ct.includes("json"))return"json";if(/^(audio|video)\//.test(ct))return"media";return"other"}
const SKIP=/^(data:|javascript:|mailto:|tel:|blob:|about:|#)/i;
function cleanUrl(raw,base){if(!raw)return null;raw=raw.trim();if(!raw||SKIP.test(raw))return null;
  try{const u=new URL(raw,base);if(u.protocol!=="http:"&&u.protocol!=="https:")return null;u.hash="";return u.href}catch{return null}}
function extractCss(text,base){const out=[];let m;
  const imp=/@import\s+(?:url\(\s*)?['"]([^'"]+)['"]/gi;while((m=imp.exec(text))){const u=cleanUrl(m[1],base);if(u)out.push([u,"css"])}
  const re=/url\(\s*['"]?([^'")\s]+)['"]?\s*\)/gi;while((m=re.exec(text))){const u=cleanUrl(m[1],base);if(u)out.push([u,null])}return out}
function extractHtml(text,base){
  const doc=new DOMParser().parseFromString(text,"text/html"); // لا يُنفَّذ أي سكربت ولا تُحمَّل أي موارد
  const b=doc.querySelector("base[href]");if(b)base=cleanUrl(b.getAttribute("href"),base)||base;
  const res=[],links=[];const add=(raw,hint)=>{const u=cleanUrl(raw,base);if(u)res.push([u,hint||null])};
  doc.querySelectorAll("*").forEach(t=>{const n=t.tagName.toLowerCase(),g=a=>t.getAttribute(a);
    if(n==="link"&&g("href")){const rel=(g("rel")||"").toLowerCase();
      if(rel.includes("stylesheet"))add(g("href"),"css");else if(/icon|apple-touch|mask-icon/.test(rel))add(g("href"),"image");
      else if(rel.includes("manifest"))add(g("href"),"json");else if(rel.includes("modulepreload"))add(g("href"),"js");
      else if(/preload|prefetch/.test(rel))add(g("href"),{script:"js",style:"css",font:"font",image:"image"}[(g("as")||"").toLowerCase()])}
    else if(n==="script"&&g("src"))add(g("src"),"js");
    else if(["img","source","video","audio","track","embed","input"].includes(n)){
      for(const a of["src","data-src","poster"])if(g(a)){const hint=(n==="video"||n==="audio")&&a==="src"?"media":(n==="img"||n==="input"||a==="poster")?"image":null;add(g(a),hint)}
      for(const a of["srcset","data-srcset"])(g(a)||"").split(",").forEach(p=>{const tok=p.trim().split(/\s+/)[0];if(tok)add(tok,"image")})}
    else if(n==="a"&&g("href")){const u=cleanUrl(g("href"),base);if(u)links.push(u)}
    else if(n==="meta"){const k=(g("property")||g("name")||"").toLowerCase();if(["og:image","twitter:image","og:video","msapplication-tileimage"].includes(k))add(g("content"),/image|tile/.test(k)?"image":"media")}
    else if(n==="style"&&t.textContent)res.push(...extractCss(t.textContent,base));
    if(g("style"))res.push(...extractCss(g("style"),base))});
  return[res,links]}

/* ---------- المسارات المحلية داخل ZIP ---------- */
const hash8=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,"0")};
const dec=s=>{try{return decodeURIComponent(s)}catch{return s}};
function localRel(url,cat){
  const p=new URL(url);let host=p.hostname.replace(/[^A-Za-z0-9.\-]/g,"_");if(p.port)host+="_"+p.port;
  const segs=dec(p.pathname).split("/").filter(Boolean),ends=p.pathname.endsWith("/")||!segs.length,clean=[];
  for(let s of segs){s=s.replace(/[^\p{L}\p{N}_.\-~ ()@+]/gu,"_").replace(/^[. ]+|[. ]+$/g,"").slice(0,100);if(s)clean.push(s)}
  if(ends||!clean.length)clean.push("index.html");
  const name=clean[clean.length-1],i=name.lastIndexOf(".");let stem=i>0?name.slice(0,i):name,ext=i>0?name.slice(i):"";
  if(!ext&&cat==="html")ext=".html";if(p.search)stem+="__"+hash8(p.search);
  clean[clean.length-1]=(stem+ext).slice(0,120);return[host,...clean].join("/")}

/* ---------- robots.txt ---------- */
function parseRobots(txt){const groups=[];let cur=null,lastUA=false;
  for(let line of txt.split(/\r?\n/)){line=line.replace(/#.*/,"").trim();const i=line.indexOf(":");if(i<0)continue;const k=line.slice(0,i).trim().toLowerCase(),v=line.slice(i+1).trim();
    if(k==="user-agent"){if(!lastUA||!cur){cur={ua:[],rules:[]};groups.push(cur)}cur.ua.push(v.toLowerCase());lastUA=true}
    else{lastUA=false;if(cur&&(k==="disallow"||k==="allow"))cur.rules.push([k,v])}}
  const g=groups.find(g=>g.ua.some(u=>u!=="*"&&"webextractorpro".includes(u)))||groups.find(g=>g.ua.includes("*"));return g?g.rules:[]}
function robotsOk(rules,url){if(!rules||!rules.length)return true;const u=new URL(url),path=u.pathname+u.search;let best=-1,allow=true;
  for(const[k,v]of rules){if(!v)continue;let pat=v;const end=pat.endsWith("$");if(end)pat=pat.slice(0,-1);
    let re;try{re=new RegExp("^"+pat.replace(/[.+?^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*")+(end?"$":""))}catch{continue}
    if(re.test(path)&&(v.length>best||(v.length===best&&k==="allow"))){best=v.length;allow=k==="allow"}}
  return allow}

/* ---------- التقرير / ZIP / JSON ---------- */
function reportText(){
  const st=stats||{discovered:0,downloaded:0,failed:0,skipped:0,size:0},L=["WEB EXTRACTOR PRO — تقرير النتائج / Results report",`URL: ${job?job.url:""}`,`Discovered: ${st.discovered} | Downloaded: ${st.downloaded} | Failed: ${st.failed} | Skipped: ${st.skipped||0}`,`Total size: ${st.size} bytes`];
  if(info){const s=info.server,d=info.database;L.push("-".repeat(60),`Server: ${s.software||"-"} | IP: ${s.ip||"-"} | Hosting/CDN: ${s.hosting.map(h=>h.name).join(", ")||"-"}`,"Tech: "+(info.tech.map(t=>t.name).join(", ")||"-"),"Database (public refs): "+(d.found.map(x=>`${x.name} [${x.kind}]`).join(", ")||"-"),"Database (likely): "+(d.inferred.map(x=>x.name).join(", ")||"-"))}
  L.push("-".repeat(60));files.forEach(it=>L.push(`${it.status.toUpperCase().padEnd(11)} ${it.category.padEnd(6)} ${String(it.size).padStart(10)}  ${it.url}${it.error?` [${it.error}${it.detail?": "+it.detail:""}]`:""}`));return L.join("\n")}
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000)}
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
/* كاتب ZIP مدمج (بدون ضغط، بدون أي مكتبة خارجية — يعمل أوفلاين) */
async function buildZip(entries){
  const enc=new TextEncoder(),parts=[],cd=[],now=new Date();let off=0;
  const dt=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xffff,tm=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xffff;
  for(const e of entries){
    const name=enc.encode(e.path),data=new Uint8Array(await e.blob.arrayBuffer()),crc=crc32(data),size=data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,name);off+=30+name.length+size}
  let cds=0;for(const x of cd)cds+=x.byteLength;
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:"application/zip"})}
async function makeZip(){
  if(!job)return;toast(T.zipping);
  try{const entries=[...store.values()].map(s=>({path:s.path,blob:s.blob}));entries.push({path:"REPORT.txt",blob:new Blob([reportText()],{type:"text/plain"})});
    saveBlob(await buildZip(entries),`${(new URL(job.url).hostname).replace(/\./g,"_")}_files.zip`)}catch(e){console.error(e);toast(T.zipFail)}}
function saveJson(){if(!job)return;saveBlob(new Blob([JSON.stringify({url:job.url,info,stats,files:[...files.values()].map(({obj,...f})=>f)},null,2)],{type:"application/json"}),"analysis.json")}

/* ---------- ربط الواجهة ---------- */
function setRunning(r){running=r;$("#startBtn").disabled=r;$("#stopBtn").disabled=!r;$("#url").disabled=r}
async function start(){
  showErr("");
  const raw=$("#url").value.trim();
  if(!raw){showErr(lang==="ar"?"أدخل رابط الموقع أولاً.":"Please enter a website URL.");return}
  if(!getW()){showErr(T.needWorker);$("#setupD").open=true;$("#setup").scrollIntoView({behavior:"smooth"});return}
  let url;try{url=normalizeUrl(raw)}catch(e){showErr(errText(e.code));return}
  const o={max_pages:Math.min(50,+$("#oPages").value||10),max_depth:Math.min(3,+$("#oDepth").value||0),max_files:Math.min(500,+$("#oFiles").value||200),max_file_mb:Math.min(25,+$("#oMb").value||10),respect_robots:$("#oRobots").checked};
  job={id:"local",url};files=new Map();stats=null;filter="all";query="";$("#q").value="";open.clear();info=null;lastPhase=lastDone=null;
  setStats({discovered:0,downloaded:0,failed:0,size:0});setPct(0);$("#phase").textContent=T.ph.start;
  $("#run").hidden=false;$("#res").hidden=false;$("#zipBtn").classList.add("off");$("#jsonBtn").classList.add("off");
  renderList();renderInfo();setRunning(true);
  let ev;
  try{ev=await run(url,o)}
  catch(e){const c=e.code||"internal";ev={type:"done",state:"error",error:c,note:e.detail||"",stats:stats||{discovered:0,downloaded:0,failed:0,size:0},has_zip:[...files.values()].some(i=>i.status==="done"),truncated:false};console.error(e)}
  finishUI(ev);
}
function finishUI(ev){
  setRunning(false);setStats(ev.stats);setPct(100);lastDone=ev;setDoneMsg(ev);renderList();renderInfo();
  if(ev.state==="error"){let m=errText(ev.error,ev.note);if(ev.error==="network"||ev.error==="worker")m+=" — "+T.workerHint;showErr(m)}
  if(ev.has_zip)$("#zipBtn").classList.remove("off");
  $("#jsonBtn").classList.remove("off");
  let h=[];try{h=JSON.parse(sessionStorage.getItem("wep_hist")||"[]")}catch{}
  h.unshift({url:job.url,t:new Date().toLocaleTimeString(),state:ev.state,n:ev.stats.downloaded,f:ev.stats.failed,size:ev.stats.size});
  try{sessionStorage.setItem("wep_hist",JSON.stringify(h.slice(0,20)))}catch{}renderHist();
}
function renderHist(){
  let h=[];try{h=JSON.parse(sessionStorage.getItem("wep_hist")||"[]")}catch{}
  $("#hist").innerHTML=h.length?h.map(x=>`<div><span>${esc(x.url)}</span><span>${esc(x.t)} · ${esc(T.state[x.state]||x.state)} · ${x.n}✓ ${x.f}✗ · ${fmt(x.size)}</span></div>`).join(""):`<span>${T.noHist}</span>`;
}
$("#startBtn").onclick=start;
$("#url").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("#stopBtn").onclick=()=>{if(ctl)ctl.abort()};
$("#newBtn").onclick=()=>{if(ctl)ctl.abort();runId++;store.forEach(s=>{});files.forEach(f=>{if(f.obj)URL.revokeObjectURL(f.obj)});job=null;info=null;files=new Map();setRunning(false);$("#run").hidden=$("#res").hidden=true;renderInfo();showErr("");$("#url").value="";$("#url").focus();lastPhase=lastDone=null};
$("#zipBtn").onclick=e=>{e.preventDefault();if(!$("#zipBtn").classList.contains("off"))makeZip()};
$("#jsonBtn").onclick=e=>{e.preventDefault();if(!$("#jsonBtn").classList.contains("off"))saveJson()};
$("#copyBtn").onclick=async()=>{if(!job)return;const t=reportText();
  try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast(T.copied)};

/* ---------- إعداد الـ Worker ---------- */
function setupInit(){
  $("#wUrl").value=getW();
  $("#setupD").open=!getW();
  $("#wCopy").onclick=async()=>{const t=$("#workerSrc").textContent.trim();try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast(T.wCopied)};
  $("#wSave").onclick=async()=>{let v=$("#wUrl").value.trim().replace(/\/+$/,"");const st=$("#wStat");
    if(v&&!/^https?:\/\//i.test(v))v="https://"+v;$("#wUrl").value=v;
    try{localStorage.setItem(WKEY,v)}catch{}
    if(!v){st.textContent="";return}
    st.className="sub";st.textContent="…";
    try{const r=await fetch(v+"/");const t=await r.text();if(r.ok&&t.includes("WEB EXTRACTOR PRO")){st.className="bd ok";st.textContent=T.wOk}else throw 0}catch{st.className="bd bad";st.textContent=T.wBad}};
}

setupInit();
applyLang();
</script>
