<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070816">
<title>WEB EXTRACTOR PRO</title>
<style>
:root{--bg:#070816;--p:#7c3aed;--b:#38bdf8;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--tx:#e8eaf6;--mut:#9aa3c7;
--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--r:18px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;min-height:100vh;line-height:1.6;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 85% 0%,rgba(124,58,237,.35),transparent),radial-gradient(50% 45% at 0% 30%,rgba(56,189,248,.22),transparent),radial-gradient(60% 50% at 50% 100%,rgba(99,102,241,.22),transparent)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:280px;height:280px;background:var(--p);top:10%;left:-60px}
.bg i:nth-child(2){width:240px;height:240px;background:var(--b);bottom:8%;right:-50px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.wrap{max-width:1120px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 0 24px rgba(124,58,237,.55)}
.brand span b{background:linear-gradient(90deg,#c4b5fd,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-r{display:flex;align-items:center;gap:8px}
.dev-pill{font-size:.78rem;padding:6px 12px;min-height:36px;border-radius:99px;color:#e9d5ff;border-color:rgba(167,139,250,.45);background:rgba(124,58,237,.18)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card{padding:18px;margin-top:16px}
.hero{text-align:center;padding:14px 4px 4px}
.hero h1{font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.25;background:linear-gradient(90deg,#fff,#c4b5fd 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:10px auto 0;max-width:640px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--tx);background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:.2s;min-height:44px}
button:hover,.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
button:disabled,.btn.off{opacity:.45;pointer-events:none}
.primary{background:linear-gradient(135deg,var(--p),#4f46e5 60%,var(--b));border-color:transparent;font-weight:700;box-shadow:0 6px 24px rgba(99,102,241,.45)}
.danger{border-color:rgba(251,113,133,.5);color:#fecdd3}
.row{display:flex;gap:10px;flex-wrap:wrap}
.urlrow{display:flex;gap:10px;flex-wrap:wrap}
.urlrow input{flex:1 1 260px;min-width:0;font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px 14px;direction:ltr;text-align:left;outline:none;min-height:48px}
.urlrow input:focus,.search:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.err{color:#fecdd3;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);border-radius:12px;padding:10px 12px;margin-top:12px}
details{color:var(--mut)}
summary{cursor:pointer;padding:6px 0}
.opts-d{margin-top:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.opts input[type=number]{font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opts .ck{flex-direction:row;align-items:center;gap:8px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--b));border-radius:99px;transition:width .35s;box-shadow:0 0 14px rgba(56,189,248,.6)}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.stat{padding:12px;text-align:center;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem;direction:ltr}
.stat span{color:var(--mut);font-size:.82rem}

/* ===== بطاقات المعلومات ===== */
.sec-t{display:flex;align-items:center;gap:10px;margin:26px 2px 4px;font-size:1.15rem}
.sec-t small{color:var(--mut);font-weight:400;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:12px}
.ic{position:relative;padding:18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;animation:pop .45s ease both}
.ic::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,var(--c1,var(--p)),var(--c2,var(--b)))}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.ic.wide{grid-column:1/-1}
.ic h3{display:flex;align-items:center;gap:10px;font-size:1.02rem;margin-bottom:12px}
.ic h3 .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1,var(--p)),var(--c2,var(--b)));color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.kv{display:grid;grid-template-columns:minmax(90px,36%) 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--mut)}
.kv dd{margin:0;word-break:break-word;direction:ltr;text-align:start}
.kv dd.rtl{direction:inherit}
.mono{font-family:var(--mono);font-size:.82rem}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:rgba(56,189,248,.14);color:#bae6fd;border:1px solid rgba(56,189,248,.3);direction:ltr}
.bd.ok{background:rgba(52,211,153,.14);color:var(--ok);border-color:rgba(52,211,153,.35)}
.bd.bad{background:rgba(251,113,133,.14);color:var(--bad);border-color:rgba(251,113,133,.35)}
.bd.warn{background:rgba(251,191,36,.14);color:var(--warn);border-color:rgba(251,191,36,.35)}
.bd.pur{background:rgba(124,58,237,.22);color:#ddd6fe;border-color:rgba(167,139,250,.4)}
.big{font-size:1.5rem;font-weight:800;direction:ltr;text-align:start;word-break:break-all}
.sub{color:var(--mut);font-size:.84rem}
.note{color:var(--mut);font-size:.82rem;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.empty{color:var(--mut);padding:8px 0}
.dbrow{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.dbrow b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbrow code{direction:ltr;text-align:start;font-family:var(--mono);font-size:.8rem;color:#bae6fd;word-break:break-all}
.techgrp{margin-bottom:10px}
.techgrp>span{display:block;font-size:.76rem;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.sec-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{--v:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--rc,var(--ok)) calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:72px;height:72px;border-radius:50%;background:#0d0f26;display:grid;place-items:center;font-size:1.3rem;direction:ltr}
.shl{flex:1 1 180px;display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.shl div{display:flex;justify-content:space-between;gap:8px;direction:ltr}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem;direction:ltr;text-align:left}
.tbl td,.tbl th{padding:5px 8px;border-bottom:1px dashed var(--line);text-align:start;word-break:break-all}
.tbl th{color:var(--mut);font-weight:600}
.scroll{max-height:260px;overflow:auto}
pre.raw{direction:ltr;text-align:left;font-family:var(--mono);font-size:.76rem;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#cbd5ff;margin-top:8px}
.chain{direction:ltr;text-align:left;font-size:.8rem;color:var(--mut);margin-top:6px}

/* ===== الملفات ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.chip{padding:6px 12px;min-height:36px;font-size:.85rem;border-radius:99px}
.chip.on{background:linear-gradient(135deg,var(--p),var(--b));border-color:transparent}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.search{flex:1 1 220px;font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-height:44px}
.files{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.fc{--c1:var(--p);--c2:var(--b);padding:14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:.2s}
.fc:hover{border-color:rgba(167,139,250,.5);transform:translateY(-2px)}
.fc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--c1),var(--c2))}
.fc-top{display:flex;gap:12px;align-items:center}
.fi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fi svg{width:22px;height:22px}
.fn{min-width:0;flex:1}
.fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-weight:650}
.fn small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-size:.76rem}
.fm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.7rem;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(124,58,237,.3);border:1px solid rgba(124,58,237,.5);direction:ltr}
.sz{color:var(--mut);font-size:.85rem;direction:ltr;white-space:nowrap}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.done{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.failed{background:rgba(251,113,133,.15);color:var(--bad)}
.pill.skipped{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.pending,.pill.downloading{background:rgba(56,189,248,.15);color:var(--b)}
.fa{display:flex;gap:8px}
.fa .btn,.fa button{flex:1;min-height:40px;padding:6px 10px;font-size:.88rem}
.fa .btn.dl{background:linear-gradient(135deg,var(--p),#4f46e5 60%,var(--b));border-color:transparent;font-weight:700}
.fa button.sm{flex:0 0 auto}
.fe{color:#fecdd3;font-size:.82rem}
.fd{border-top:1px dashed var(--line);padding-top:10px}
.fd .kv{font-size:.82rem}
.steps{padding-inline-start:22px;color:var(--mut);font-size:.9rem;margin-top:8px}.steps li{margin:5px 0}.steps code{direction:ltr;unicode-bidi:embed;font-family:var(--mono);font-size:.82rem;color:#bae6fd}
.notice h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.notice ul{padding-inline-start:20px;color:var(--mut);font-size:.9rem}
.hist{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:.88rem}
.hist div{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;direction:ltr;padding:6px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12142e;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:9;max-width:92vw}
[hidden]{display:none!important}
footer{margin-top:28px;text-align:center}
.dev{position:relative;overflow:hidden;display:inline-flex;flex-direction:column;gap:5px;align-items:center;padding:18px 30px;border-radius:22px;background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(56,189,248,.16));border:1px solid rgba(167,139,250,.48);box-shadow:0 12px 38px rgba(124,58,237,.24),inset 0 1px 0 rgba(255,255,255,.12)}
.dev:before{content:"✦  ✧  ✦";font-size:.8rem;letter-spacing:5px;color:#a5f3fc;text-shadow:0 0 14px rgba(56,189,248,.8)}
.dev b{font-size:1.15rem;font-weight:900;letter-spacing:.25px;background:linear-gradient(90deg,#fff,#c4b5fd,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.dev span{color:#cbd5e1;font-size:.82rem}
.dev:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.06) 50%,transparent 75%)}
.use{color:var(--mut);font-size:.8rem;margin-bottom:14px}
@media(max-width:640px){.grid,.files{grid-template-columns:1fr}.dev-pill{display:none}.kv{grid-template-columns:minmax(80px,38%) 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Live Preview ===== */
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pv[hidden]{display:none}
.pvbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.05)}
.pvbar button,.pvbar select{min-height:38px;padding:4px 10px;font:inherit;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px}
.pvbar select{max-width:200px;direction:ltr}.pvbar button.on{background:var(--p)}
.pvbar label{font-size:.8rem;color:var(--mut);display:flex;gap:4px;align-items:center}
#pvStage{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto;padding:8px}
#pvFrame{background:#fff;border:1px solid var(--line);border-radius:10px;width:100%;height:100%}
#pvDbg{max-height:28vh;overflow:auto;font:12px var(--mono);direction:ltr;text-align:left;padding:8px;border-top:1px solid var(--line);background:rgba(0,0,0,.4)}
#pvDbg div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}#pvDbg .e{color:var(--bad)}#pvDbg .w{color:var(--warn)}#pvDbg .i{color:var(--ok)}

#pj{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:14px}#pj[hidden]{display:none}
#pj .pjbox{width:min(560px,100%);max-height:80vh;overflow:auto;padding:16px}
.pji{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.pji small{display:block;color:var(--mut);direction:ltr;text-align:start}.pji button{min-height:38px;padding:4px 10px}

.rt input,.rt select{font:inherit;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;min-width:0;direction:ltr;text-align:left}
.rt input{flex:1 1 240px}.rt select{flex:1 1 160px;max-width:100%}
.rt pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px var(--mono);margin-top:8px}
.rt table{width:100%;direction:ltr;font:12px var(--mono);border-collapse:collapse;margin-top:8px}.rt td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}.rt td:first-child{color:var(--b);white-space:nowrap}
.tr details{margin-inline-start:14px}.tr summary{color:var(--tx)}.tr .tf{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0 4px 14px;direction:ltr;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}.tr .tf span{word-break:break-all}.tr .tf a,.tr .tf button{min-height:34px;padding:2px 10px}

.fa{flex-wrap:wrap}
#ed{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#ed[hidden]{display:none}
#edV,#edT{flex:1;min-height:0;margin:0;padding:12px;overflow:auto;direction:ltr;text-align:left;font:12.5px/1.6 var(--mono);white-space:pre;color:var(--tx);background:rgba(0,0,0,.35);border:0;resize:none;tab-size:2}
#edT{outline:none;white-space:pre;overflow-wrap:normal}
.hc{color:#6b7599}.hs{color:#86efac}.hn{color:#fbbf24}.hk{color:#c4b5fd}.ht{color:#38bdf8}
#pvStage.split{flex-wrap:wrap;gap:8px}#pvStage.split #pvFrame{flex:1 1 320px;min-height:45%}
#pvSrc{flex:1 1 320px;min-height:40%;margin:0;overflow:auto;direction:ltr;text-align:left;font:12px/1.5 var(--mono);white-space:pre;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:10px}
.dbar{display:flex;align-items:center;gap:8px;margin:5px 0;direction:ltr;font-size:.82rem}.dbar b{width:62px;flex:none}.dbar i{display:block;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--b));min-width:3px}.dbar span{color:var(--mut);white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>

<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>

<script type="text/plain" id="workerSrc">
// WEB EXTRACTOR PRO — Cloudflare Worker (وسيط CORS آمن)
// الصق هذا الكود كاملاً في Cloudflare ← Workers & Pages ← Create ← Hello World ← Edit code ← Deploy.
// اختياري: ضع رابط موقعك على GitHub Pages هنا ليستخدم الوسيط موقعك فقط (مثال: "https://username.github.io")
const ALLOWED_ORIGIN = "";

const MAX_BYTES = 25 * 1024 * 1024;
const MAX_REDIRECTS = 5;
const PORTS = new Set(["", "80", "443", "8080", "8443"]);
const UA = "WebExtractorPro/2.0 (public-resources collector)";
const BLOCKED_HOST = /^(localhost|metadata|instance-data|.*\.(local|localhost|internal|intranet|lan|home|corp|workers\.dev))$/i;

function cors(origin) {
  return {
    "Access-Control-Allow-Origin": ALLOWED_ORIGIN || origin || "*",
    "Access-Control-Expose-Headers": "x-proxy-meta, x-proxy-error, x-proxy-detail",
    "Access-Control-Allow-Methods": "GET, OPTIONS",
    "Vary": "Origin",
  };
}

function fail(origin, status, code, detail = "") {
  return new Response(null, {
    status,
    headers: { ...cors(origin), "x-proxy-error": code, "x-proxy-detail": String(detail).slice(0, 100) },
  });
}

function badHost(h) {
  h = h.toLowerCase().replace(/^\[|\]$/g, "").replace(/\.$/, "");
  if (BLOCKED_HOST.test(h)) return true;
  if (h.includes(":")) return true; // IPv6 literals غير مسموحة
  if (/^[\d.]+$/.test(h) || /^0x[0-9a-f]+$/i.test(h)) return true; // IP literals بكل صيغها
  return !h.includes(".");
}

function validate(raw) {
  let u;
  try { u = new URL(raw); } catch { return null; }
  if (u.protocol !== "http:" && u.protocol !== "https:") return null;
  if (u.username || u.password) return null;
  if (!PORTS.has(u.port)) return null;
  if (badHost(u.hostname)) return null;
  return u;
}

function cookieInfo(resp) {
  // أسماء الكوكيز وأعلامها فقط — لا تُرسَل القيم أبداً
  let list = [];
  try { list = resp.headers.getSetCookie ? resp.headers.getSetCookie() : []; } catch { /* ignore */ }
  return list.slice(0, 30).map((c) => {
    const parts = c.split(";").map((p) => p.trim());
    const low = parts.slice(1).map((p) => p.toLowerCase());
    const ss = low.find((p) => p.startsWith("samesite="));
    return {
      name: parts[0].split("=")[0].slice(0, 60),
      secure: low.includes("secure"),
      httponly: low.includes("httponly"),
      samesite: ss ? ss.split("=")[1] : "—",
    };
  });
}

function limiter(max) {
  let n = 0;
  return new TransformStream({
    transform(chunk, ctl) {
      n += chunk.byteLength;
      if (n > max) ctl.error(new Error("too_large"));
      else ctl.enqueue(chunk);
    },
  });
}

export default {
  async fetch(req, env) {
    const origin = req.headers.get("Origin") || "";
    const allowed = (env && env.ALLOWED_ORIGIN) || ALLOWED_ORIGIN;
    if (req.method === "OPTIONS") return new Response(null, { status: 204, headers: cors(origin) });
    if (allowed && origin !== allowed) return fail(origin, 403, "forbidden");

    const q = new URL(req.url).searchParams;
    const target = q.get("url");
    if (!target) return new Response("WEB EXTRACTOR PRO worker is running ✔", { headers: cors(origin) });
    let cur = validate(target);
    if (!cur) return fail(origin, 400, "unsafe");
    const max = Math.min(parseInt(q.get("max") || "", 10) || MAX_BYTES, MAX_BYTES);
    const accept = q.get("a") === "h" ? "text/html,application/xhtml+xml,*/*;q=0.8" : "*/*";

    const t0 = Date.now();
    const chain = [];
    let resp = null;
    try {
      for (let i = 0; i <= MAX_REDIRECTS; i++) {
        resp = await fetch(cur.toString(), {
          redirect: "manual",
          headers: { "User-Agent": UA, Accept: accept },
          cf: { cacheTtl: 0 },
        });
        if ([301, 302, 303, 307, 308].includes(resp.status)) {
          const loc = resp.headers.get("location");
          if (!loc) return fail(origin, 502, "redirect_bad");
          chain.push({ url: cur.toString(), status: resp.status });
          const next = validate(new URL(loc, cur).toString());
          if (!next) return fail(origin, 400, "unsafe");
          cur = next;
          resp = null;
          continue;
        }
        break;
      }
    } catch (e) {
      return fail(origin, 502, "network", e && e.message);
    }
    if (!resp) return fail(origin, 502, "too_many_redirects");

    const headers = {};
    let size = 0;
    for (const [k, v] of resp.headers) {
      if (/^(set-cookie|cookie|authorization)$/i.test(k)) continue;
      const val = v.slice(0, 200);
      size += k.length + val.length;
      if (size < 5000) headers[k.toLowerCase()] = val;
    }
    const meta = {
      final_url: cur.toString(), status: resp.status, headers, chain,
      cookies: cookieInfo(resp), ms: Date.now() - t0,
    };
    const out = { ...cors(origin), "x-proxy-meta": encodeURIComponent(JSON.stringify(meta)),
      "Content-Type": "application/octet-stream", "Cache-Control": "no-store", "X-Content-Type-Options": "nosniff" };

    const cl = parseInt(resp.headers.get("content-length") || "", 10);
    if (resp.status >= 400 || !resp.body) return new Response(null, { status: 200, headers: out });
    if (cl > max) return fail(origin, 413, "too_large");
    return new Response(resp.body.pipeThrough(limiter(max)), { status: 200, headers: out });
  },
};
</script>

    [T.k.software,s.software],[T.k.powered,s.powered_by],[T.k.hosting,`<div class="badges">${host}</div>`,"html"],
    [T.k.ip,s.ip,"mono"],[T.k.http,s.http_version],[T.k.status,s.status],[T.k.ms,s.response_ms?s.response_ms+" ms":""],
    [T.k.https,s.https?`✓ ${T.yes}`:`✗ ${T.no}`],[T.k.ctype,s.content_type],[T.k.enc,s.content_encoding],[T.k.cache,s.cache_control],[T.k.lm,s.last_modified],[T.k.date,s.date],[T.k.via,s.via]
  ])+(chain?`<div class="note"><b>${esc(T.c.chain)}</b>${chain}</div>`:""));
}
function dbCard(d,done){
  let body="";
  (d.found||[]).forEach(x=>{body+=`<div class="dbrow"><b>${esc(x.name)} ${bd(T.dbDetected,"ok")} ${bd(x.kind)}</b><code>${esc(x.host)}</code><span class="sub">${esc(T.dbFiles)}: ${esc((x.files||[]).join(", "))}</span></div>`});
  (d.inferred||[]).forEach(x=>{body+=`<div class="dbrow"><b>${esc(x.name)} ${bd(T.dbLikely,"warn")}</b><span class="sub">${esc(T.dbLikelyTxt(x.platform))}</span></div>`});
  if(!body)body=`<div class="empty">${esc(done?T.dbNone:T.analyzing)}</div>`;
  return card("",'#10b981','#38bdf8',"i-db",T.c.db,body+`<div class="note">${esc(T.dbNote)}</div>`);
}
function techCard(list){
  if(!list.length)return card("",'#a78bfa','#7c3aed',"i-cpu",T.c.tech,`<div class="empty">${esc(T.noTech)}</div>`);
  const g={};list.forEach(t=>(g[t.category]=g[t.category]||[]).push(t));
  const body=Object.keys(g).sort().map(c=>`<div class="techgrp"><span>${esc(T.cats[c]||c)}</span><div class="badges">${g[c].map(t=>`<span class="bd pur" title="${esc(t.evidence)}">${esc(t.name)}</span>`).join("")}</div></div>`).join("");
  return card("",'#a78bfa','#7c3aed',"i-cpu",T.c.tech,body);
}
function secCard(s){

function cookieCard(c){

function renderList(){
  const counts={all:files.size};CATS.forEach(c=>counts[c]=0);files.forEach(f=>counts[f.category]=(counts[f.category]||0)+1);
  $("#chips").innerHTML=["all",...CATS].filter(c=>c==="all"||counts[c]).map(c=>`<button type="button" class="chip ${filter===c?"on":""}" data-c="${c}">${c==="all"?T.all:c.toUpperCase()} (${counts[c]})</button>`).join("");
  const q=query.toLowerCase();
  const rows=job?[...files.values()].filter(f=>(filter==="all"||f.category===filter)&&(!q||f.url.toLowerCase().includes(q)||f.name.toLowerCase().includes(q))):[];

/* ================= المحرك: يعمل كله داخل المتصفح عبر Cloudflare Worker ================= */
const WKEY="wep_worker";
const getW=()=>{let v="";try{v=localStorage.getItem(WKEY)||""}catch{}return(v||WORKER_URL||"").trim().replace(/\/+$/,"")};
class FErr extends Error{constructor(c,d=""){super(c);this.code=c;this.detail=d}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MAX_TOTAL=120*1024*1024;
let ctl=null, store=new Map(), runId=0;

/* ---------- الاتصال عبر الـ Worker ---------- */
async function pget(url,{html=false,max=10485760}={}){
  while(window.__paused&&!(ctl&&ctl.signal.aborted))await new Promise(r=>setTimeout(r,200));
  const W=getW();
  let r;
  try{r=await fetch(`${W}/?url=${encodeURIComponent(url)}&max=${max}${html?"&a=h":""}`,{signal:ctl.signal})}
  catch(e){if(e.name==="AbortError")throw e;throw new FErr("network","worker")}
  const err=r.headers.get("x-proxy-error");
  if(err)throw new FErr(err,r.headers.get("x-proxy-detail")||"");
  if(!r.ok)throw new FErr("worker","HTTP "+r.status);

    while(used.has(rel)){rel=base.replace(/(\.[^./]+)?$/,m=>"_"+n+(m||""));n++}
    store.set(id,{blob,path:rel});f.obj=URL.createObjectURL(blob);f.local_path=rel;f.size=r.buf.byteLength;f.status="done";f.error="";f.detail="";f.http_status=r.status;f.content_type=(r.ct||"").split(";")[0];toast("✔ "+f.name)}

const _fc=fileCard;fileCard=function(f){let h=_fc(f),x="";
  if(f.status==="done"){if(isText(f))x+=`<button type="button" class="sm" data-ed="${esc(f.id)}">✏️ ${tx("عرض/تعديل","View/Edit")}</button>`;x+=`<button type="button" class="sm danger" data-del="${esc(f.id)}">🗑</button>`}

/* --- الداشبورد + التصدير --- */
const cell=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
function rows(){return[...files.values()]}
function dash(){
  const all=rows(),host=job?new URL(job.url).hostname.replace(/^www\./,""):"",by={};let ext=0,int=0;
  all.forEach(f=>{const c=by[f.category]||(by[f.category]={n:0,s:0});c.n++;if(f.status==="done")c.s+=f.size||0;try{new URL(f.url).hostname.replace(/^www\./,"")===host?int++:ext++}catch{}});
  const mx=Math.max(1,...Object.values(by).map(c=>c.s)),failed=all.filter(f=>f.status==="failed"),done=all.filter(f=>f.status==="done"),tot=done.reduce((a,f)=>a+(f.size||0),0);

   `<div class="stats"><div class="stat"><b>${all.filter(f=>f.category==="html"&&f.status==="done").length}</b><span>${tx("صفحات","Pages")}</span></div><div class="stat"><b>${all.length}</b><span>${tx("ملفات","Files")}</span></div><div class="stat"><b>${fmt(tot)}</b><span>${tx("الحجم","Size")}</span></div><div class="stat"><b>${failed.length}</b><span>${tx("فاشلة","Failed")}</span></div></div>
    <h4 style="margin:12px 0 4px">${tx("حسب النوع (الحجم)","By type (size)")}</h4>${Object.entries(by).sort((a,b)=>b[1].s-a[1].s).map(([k,c])=>`<div class="dbar"><b>${esc(k)}</b><i style="width:${Math.max(2,Math.round(c.s/mx*55))}%"></i><span>${c.n} · ${fmt(c.s)}</span></div>`).join("")}

    <div class="row" style="margin-top:14px"><button data-ex="csv" type="button">CSV</button><button data-ex="html" type="button">HTML</button><button data-ex="json" type="button">JSON</button></div>`;

$("#pjL").addEventListener("click",e=>{const b=e.target.closest("[data-ex]");if(!b)return;const k=b.dataset.ex,all=rows(),name=(job?new URL(job.url).hostname:"site").replace(/\./g,"_");

/* --- استيراد ZIP (مع التحقق من المسارات) --- */
const safe=p=>{p=p.replace(/\\/g,"/");if(!p||p.startsWith("/")||/^[a-z]:/i.test(p)||p.split("/").some(x=>x===".."))return null;return p.replace(/^\.\//,"")};
async function inflate(u8){const ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function importZip(file){
  try{const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);let e=-1;
    for(let i=buf.length-22;i>=Math.max(0,buf.length-65600);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
    if(e<0)throw new Error("not a zip");
    const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true),skipped=0,added=0,total=0;
    if(n>2000)throw new Error("too many entries");
    if(!job)job={id:"local",url:"https://zip.local/"};
    if(ctl)ctl.abort();
    const dec=new TextDecoder();let idn=files.size;
    for(let i=0;i<n;i++){
      if(dv.getUint32(p,true)!==0x02014b50)break;
      const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
      const name=dec.decode(buf.slice(p+46,p+46+nl));p+=46+nl+el+cl;
      if(name.endsWith("/"))continue;
      const path=safe(name);if(!path||us>5e7||(total+=us)>1.5e8){skipped++;continue}
      const ln=dv.getUint16(lo+26,true),le=dv.getUint16(lo+28,true),raw=buf.slice(lo+30+ln+le,lo+30+ln+le+cs);
      let data;try{data=meth===0?raw:meth===8?await inflate(raw):null}catch{data=null}
      if(!data){skipped++;continue}
      const url="https://zip.local/"+path.split("/").map(encodeURIComponent).join("/"),id="z"+(++idn),blob=new Blob([data]);
      const it={id,url,name:path.split("/").pop(),category:catFor(url)||"other",source:"zip",status:"done",size:data.length,error:"",detail:"",content_type:"",sha256:"",last_modified:"",http_status:200,cache_control:"",encoding:"",server:"",local_path:path,obj:URL.createObjectURL(blob)};
      files.set(id,it);store.set(id,{blob,path});added++}
    $("#run").hidden=false;$("#res").hidden=false;setRunning(false);recalc();setPct(100);renderList();
    toast(tx(`تم استيراد ${added} ملف`+(skipped?` (تخطّي ${skipped} غير آمن/غير مدعوم)`:""),`Imported ${added} files`+(skipped?` (${skipped} skipped)`:"")))
  }catch(x){toast(tx("فشل فتح ZIP: ","ZIP failed: ")+x.message)}}
$("#zipImp").onclick=()=>$("#zipIn").click();
$("#zipIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importZip(f)};

/* ================= إيقاف مؤقت/استئناف + إعادة كل الفاشلة ================= */
(()=>{
const tx=(a,e)=>lang==="ar"?a:e;
const pl=()=>{const pb=$("#pauseBtn");pb.querySelector("span").textContent=window.__paused?tx("استئناف","Resume"):tx("إيقاف مؤقت","Pause");pb.firstChild.textContent=window.__paused?"▶ ":"⏸ ";$("#rtAll span").textContent=tx("إعادة كل الفاشلة","Retry all failed")};pl();

let busy=false;
$("#rtAll").onclick=async()=>{if(busy||running)return;const ids=[...files.values()].filter(f=>f.status==="failed").map(f=>f.id);
  if(!ids.length){toast(tx("لا توجد ملفات فاشلة","No failed files"));return}

  for(const id of ids){const b=document.querySelector(`[data-rt="${id}"]`);if(b){b.click();await new Promise(r=>{const t=setInterval(()=>{const f=files.get(id);if(!f||f.status!=="downloading"){clearInterval(t);r()}},150)})}await new Promise(r=>setTimeout(r,300));if(files.get(id)&&files.get(id).status==="done")ok++}
